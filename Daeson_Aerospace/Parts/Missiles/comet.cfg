	description = The Comet began as a research program with the goal of producing and testing a set of Active Radar Homing missiles based on the imported technology of the Phoenix and AMRAAM missiles. This program was expanded and rushed following the events of the Constellation War, and the resulting AAM-12A essentially traded mass and cost to achieve a similar effect to the AIM-120s of its day. However, while its sister the Flash was a simple reproduction of the methods and components behind the AIM-9M, the Comet was also tasked with entertaining various experimental (for Darian domestic industry) production methods and technologies. The final missile, as a direct consequence, was rather divisive, but achieved most of its objectives and taught many lessons which could be learned for the later development of missiles such as the AAM-18 series. The 12C has had its tracking downtuned for competition purposes.

@PART[psc_mapc]:BEFORE[zzz_SimpleRepaint]
{
    %SR_Ignore = true
}

PART
{
// Kerbal Space Program - Part Config

// --- general parameters ---
name = psc_mapc
module = Part
author = SuicidalInsanity, Android

// --- asset parameters ---
mesh = Model.mu
rescaleFactor = 1

// --- node definitions ---
node_attach = 0, -0.274, 0.0, 0, -1, 0, 1

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 7600
category = Utility
subcategory = 0
title = X07 Magnetically-Accelerated Photon Converger
manufacturer = DroidCorp Competition Division
description = An energy weapon utilizing a barely-understood method of delivery and containment. Operation of this weapon is not covered by competition insurance policies. But of course, if you care about that kind of stuff, you weren't considering using this anyways. May require additional HVEC storage depending on your setup.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 0.3
dragModelType = default
maximum_drag = 0.01
minimum_drag = 0.01
angularDrag = 2
crashTolerance = 20
maxTemp = 3600
stagingIcon = SOLID_BOOSTER
bulkheadProfiles = srf
tags = #loc_BDArmory_part_bahaTLS_tags

MODULE
{
	name = ModuleWeapon
	shortName = M-APC

	fireTransformName = fireTransform
	
	hasDeployAnim = false
	hasFireAnimation = true
	fireAnimName = MDLC_Fire
	fireAnimOverrideSpeed = 8.2644 //20s anim / 2.42s fire duration
	hasChargeAnimation = true
	chargeAnimName = MDLC_Charge
	hasReloadAnim = true
	reloadAnimName = MDLC_Cooldown
	spinDownAnimation = false 
	postFireChargeAnim = false
	maxEffectiveDistance = 10000
	maxTargetingRange = 10000
	ammoName = Photon-G
	requestResourceAmount = 10 //resource per sec for beamLasers
	secondaryAmmoName = HighVoltageEC
	secondaryAmmoPerShot = 	1
	
	weaponType = laser
	BurstFire = true //fire weapon until magazine empty
	BeltFed = false
	RoundsPerMag = 100 //2 sec sustained beam, matched to firing sound -android
	ReloadTime = 20 //in seconds

	ChargeTime = 1.95 //how long does it take to charge before it can fire (railguns/DEWs/etc)
	ChargeEachShot = False //charge, then fire until trigger released/out of ammo/overheated
	chargeHoldLength = 0

	laserDamage = 13500 //5.46k DPS, +/-20 depending on range
	tanAngle = 0.00001 //controls how quickly damage scales down with distance
	
	startColor = 100, 255, 100, 255 //starting beamFX color if DynamicBeamColor
	projectileColor = 100, 255, 100, 255 //end color
	tracerStartWidth = 1.5
	tracerEndWidth = 1.5
	
	maxHeat = 1000
	heatPerShot = 0 //using mag reloads instead
	heatLoss = 1000
	
	fireSoundPath = DroidCorp/Parts/mapc/mapc_fire
	chargeSoundPath = DroidCorp/Parts/mapc/mapc_charge
	overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
	oneShotSound = false
	reloadAudioPath = DroidCorp/Parts/mapc/mapc_cooldown
	//laserTexturePath = Daeson_Aerospace/Parts/Guns/X5_[REDACTED]/laser
}
MODULE
{
	name = ModuleCASE //the gun can explode, because explosions are fun and also accurate to the source material -android
	CASELevel = 0
}

RESOURCE
{
	name = Photon-G
	amount = 100
	maxAmount = 100
}

}
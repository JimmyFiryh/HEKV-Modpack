//===================
// FJRT Control Surface Deflection Speed
//
// 
//===================


@PART[*]:HAS[@MODULE[ModuleControlSurface]]:FINAL
{
    @MODULE[ModuleControlSurface]
    {
        @actuatorSpeed = 120
    }
}

@PART[*]:HAS[@MODULE[ModuleAeroSurface]]:FINAL
{
    @MODULE[ModuleAeroSurface]
    {
        @actuatorSpeed = 60
    }
}
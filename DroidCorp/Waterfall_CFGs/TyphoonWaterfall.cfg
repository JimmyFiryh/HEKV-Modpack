@PART[BDA_EJ200]:NEEDS[Waterfall]:FOR[StockWaterfallEffects]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  	EFFECTS
	{		

		Ty_running_dry
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.2
				volume = 1.0 0.45
				pitch = 0.0 0.2
				pitch = 0.05 0.4
				pitch = 0.33 0.7
				pitch = 1.0 1.3
				loop = true
			}
		}

		Ty_power_dry
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_deep
				volume = 0.0 0.0
				volume = 0.05 0.5
				volume = 1.0 1.4
				pitch = 0.0 0.3
				pitch = 1.0 0.6
				loop = true
			}
		}
		Ty_running_wet
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.3
				volume = 1.0 0.45
				pitch = 0.0 0.2
				pitch = 0.05 0.4
				pitch = 0.33 0.7
				pitch = 1.0 0.9
				loop = true
			}
		}
		Ty_power_wet
		{

			AUDIO
			{
				channel = Ship
				clip = sound_rocket_spurts
				volume = 0.0 0.0
				volume = 0.1 0.4
				volume = 1.0 0.6
				pitch = 0.0 0.1
				pitch = 0.33 0.2
				pitch = 1.0 3.0
				loop = true
			}
			
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.2
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = smokePoint
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*],0
	{
	  %powerEffectName = Ty_power_dry
	  %spoolEffectName = Ty_running_dry
	}
@MODULE[ModuleEngines*],1
	{
	  %runningEffectName = Ty_power_wet
	  %spoolEffectName = Ty_running_wet
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = TyDry
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = Dry
		responseRateUp = 0.01
		responseRateDown = 0.01
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	TEMPLATE
    {
      templateName = stock-kerozine-turbofan-2
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0, 0, 0
      scale = .5, .5, .5
    }
  }
  
MODULE
  {
    name = ModuleWaterfallFX
    moduleID = TyWet
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
	  linkedTo = throttle
	  engineID = Wet
	  responseRateUp = 0.001
      responseRateDown = 0.016
    }
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
    TEMPLATE
    {
      templateName = stock-kerozine-afterburner
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0, 0, 0
      scale = .5, .5, .35
    }
  }
}
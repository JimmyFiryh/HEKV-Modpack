@PART[ICET]:NEEDS[Waterfall]:FOR[StockWaterfallEffects]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  	EFFECTS
	{
        ICETpowerspool
        {
            
			AUDIO
            {
				name = ramp
                channel = Ship
                clip = NMB/Parts/Engine/sound/Jet2
                volume = 0.0 0.0
				volume = 0.05 1.2
				volume = 0.75 2
                volume = 1.0 1.3
                pitch = 0.0 0.0
				pitch = 0.1 0.4
				pitch = 0.93 1.1
				pitch = 0.95 1.2
                pitch = 1.0 1.52
                loop = true
                speed = 0.0 1.0
                speed = 1.0 3.0
            }
			AUDIO
			{
				name = flame
				channel = Ship
				clip = OPT_Reconfig/Sounds/RCSnoise_9
				volume = 0.0 0.0
				volume = 0.05 0.6
				volume = 1.0 1.8
				pitch = 1.0 1.0
				pitch = 2.0 1.3
				loop = true
				speed = 0.0 2.0
				speed = 1.0 2.0
			}
        }
		
        engage
        {
            AUDIO
            {
				name = engageengine
                channel = Ship
                clip = sound_vent_soft
                volume = 0.2
                pitch = 0.4
                loop = false
            }
        }

        disengage
        {
            AUDIO
            {
                channel = Ship
                clip = sound_vent_soft
                volume = 0.1
                pitch = 0.6
                loop = false
				speed = 1 0.2
            }
        }

        flameout
        {
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 0.3
                pitch = 2.0
                loop = false
            }
        }
	}
	
@MODULE[ModuleEngines*],0
	{
	  %runningEffectName = ICETpowerspool
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = ICET
	
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
	  linkedTo = throttle
	  engineID = 
	  responseRateUp = 0.005
      responseRateDown = 0.016
    }
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
    TEMPLATE
    {
      templateName = ICET_Plume
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0,0,0
      scale = 1, 1, 1
    }
  }
}
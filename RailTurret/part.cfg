BULLET
{
    name = LightCordiumBullet
	DisplayName = Cordium Beam
	caliber = 50
	bulletVelocity = 10000
	bulletMass = 2
	//HE Bullet Values
	explosive = None
	incendiary = False
	tntMass = 0
	fuzeType = None 
	projectileColor = 122, 170, 240, 128
	fadeColor = False
	startColor = 122, 170, 240, 0
	projectileCount = 1
	apBulletMod = 1
	bulletDragTypeName = AnalyticEstimate	
}

PART
{
// Kerbal Space Program - Part Config
// 
// 

// --- general parameters ---
name = cordiumTurret
module = Part
author = Android, Eclipse, Suicidalinsanity

// --- asset parameters ---
mesh = railTurret.mu
rescaleFactor = 1.25


// --- node definitions ---
node_attach = 0.0, 0.0, 0, 0, -1, 0, 1
node_stack_bottom = 0.0, 0.0, 0, 0, -1, 0, 1 

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 8500
cost = 3500
category = Utility
subcategory = 0
title = Cordium Railgun Turret
manufacturer = Kerbelka Heavy Industries
description = ORANGE
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 1
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 60
maxTemp = 3600
stagingIcon = SOLID_BOOSTER
bulkheadProfiles = srf, Size1
tags = #loc_BDArmory_part_bofors_tags

MODULE
{
	name = ModuleTurret
	
	yawTransformName = Housing
	pitchTransformName = Rotator
	
	pitchSpeedDPS = 20
	yawSpeedDPS = 30
	
	minPitch = 0
	maxPitch = 85
	yawRange = 360
	
	smoothRotation = true
	smoothMultiplier = 10
}

MODULE
{
	name = ModuleWeapon

	shortName = CRT

	//Model setup
	fireTransformName = fireTransform
	muzzleTransformName = muzzleTransform
	hasDeployAnim = false
	hasFireAnimation = true
	fireAnimName = Bofors1; 
	spinDownAnimation = false

	//general stats
	roundsPerMinute = 4
	maxDeviation = 1
	maxEffectiveDistance = 30000
	//maxTargetingRange = 6000
	weaponType = ballistic
	bulletType = LightCordiumBullet
	ammoName = CannonShells
	requestResourceAmount = 1
	shellScale = 0.75			
	hasRecoil = false
	onlyFireInRange = true
	bulletDrop = false

	//tracer graphics
	tracerOverrideWidth = true //use .cfg values for tracer widths instead of calculated from bullet caliber
	tracerLength = 0
	tracerDeltaFactor = 2.75
	tracerInterval = 0
	tracerStartWidth = 1
	tracerEndWidth = 1
	nonTracerWidth = 1

	autoProxyTrackRange = 30000
	fireSoundPath = RailTurret/bang
	overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat

	oneShotSound = true		
	showReloadMeter = true
	maxHeat = 3600
	heatPerShot = 1200
	heatLoss = 500
	explModelPath = BDArmory/Models/explosion/30mmExplosion
	explSoundPath = BDArmory/Sounds/subExplode

	///Cordium Settings
	maxTargetingRange = 50000
	cordiumDuration = 5
	hurtDiameter = 20
	cordiumDPS = 1000
	beamScalar = 0.005
	bulletTexturePath = RailTurret/bullet
	smokeTexturePath = RailTurret/cordium

	//railgun settings
	ChargeTime = 0.5 
	ChargeEachShot = True
	chargeSoundPath = RailTurret/charge
	secondaryAmmoName = ElectricCharge
	secondaryAmmoPerShot = 50
}

RESOURCE
{
	name = CannonShells
	amount = 20
	maxAmount = 20
}

MODULE
{
    name = HitpointTracker
    ArmorThickness = 10
    maxHitPoints = 2500
    ExplodeMode = Never
}

}


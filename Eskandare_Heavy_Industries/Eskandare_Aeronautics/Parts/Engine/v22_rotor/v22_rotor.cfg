			{
				channel = Ship
				clip = Eskandare_Heavy_Industries/Eskandare_Aeronautics/Sounds/EHI_KRX_turbineShutdown
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	

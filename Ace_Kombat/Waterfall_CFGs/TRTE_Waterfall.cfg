@PART[AK_MacrossJet]:NEEDS[Waterfall]:FOR[StockWaterfallEffects]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  	EFFECTS
    {		

		M_running_dry
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.2
				volume = 1.0 0.4
				pitch = 0.0 0.2
				pitch = 0.05 0.4
				pitch = 1.0 0.5
				loop = true
			}
		}

		M_power_dry
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_deep
				volume = 0.0 0.0
				volume = 0.05 0.6
				volume = 1.0 1.3
				pitch = 0.0 0.3
				pitch = 1.0 0.6
				loop = true
			}
		}
		M_running_wet
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.2
				volume = 1.0 0.35
				pitch = 0.0 0.2
				pitch = 0.05 0.4
				pitch = 1.0 0.6
				loop = true
			}
		}
		M_power_wet
		{

			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/MacWet
				volume = 0.0 0.0
				volume = 0.1 0.4
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 0.33 0.8
				pitch = 1.0 1.5
				loop = true
			
			}
		}
		wet
		{
			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/MacToggle
				volume = 2.0
				pitch = 1.0
				loop = false
			}
		}
		dry
		{
			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/MacDry
				volume = 2.0
				pitch = 1.0
				loop = false
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*],0
	{
	  %powerEffectName = M_power_dry
	  %spoolEffectName = M_running_dry
	}
@MODULE[ModuleEngines*],1
	{
	  %runningEffectName = M_power_wet
	  %spoolEffectName = M_running_wet
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = MDry
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = Dry
		responseRateUp = 0.05
		responseRateDown = 0.10
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	TEMPLATE
    {
      templateName = NMBspool
		overrideParentTransform = VectorControl
		position = 0,0,-0.7
		rotation = 0, 180, 0
		scale = 0.3, 0.9, 1
    }
  }
  
MODULE
  {
    name = ModuleWaterfallFX
    moduleID = MWet
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
	  linkedTo = throttle
	  engineID = Wet
	  responseRateUp = 0.016
      responseRateDown = 0.016
    }
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
    TEMPLATE
    {
      templateName = ICET_Plume
      overrideParentTransform = VectorControl
      position = 0,0,-0.6
	  rotation = 0, 180, 0
	  scale = 0.6, 1, 1.2
    }
  }
}
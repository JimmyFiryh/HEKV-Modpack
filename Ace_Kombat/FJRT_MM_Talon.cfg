//===================
// FJRT Overhaul Patch 22-09-11-A
//
// This ModuleManager patch is intended to force Stardust's Talon changes out of the package deal with the massive gamechanging MM patch for the whole modpack. It is up-to-date as of 11/5.
//===================

// MPR-SAE TFJ-229-DT-938 Talon
// Balance changes:
// Thrust numbers increased to make their effective thrust comparable to FJRT Cheetah and FJRT B9 F119 at combat flight speeds
// Dry thrust: 105 to 142
// Wet thrust: 157 to 192, heat production lowered as on Cheetah
// Velocity curves not modified
// ... other than adding speed limit which was missed; temp patch, will be fixed for final engine release.

@PART[SAE_tfj_229_938mm]:FINAL
{
    @title =  FJRT / TFJ-229-DT-938 "Talon" 

    @MODULE[ModuleEnginesFX],0
    {
        @maxThrust = 142
    }
    @MODULE[ModuleEnginesFX],1
    {
        @maxThrust = 192
        @heatProduction = 45
        
    }
}

// MPR-SAE TFJ-229 Talon (Mk1 Size)
// Balance changes:
// Thrust numbers increased to make their effective thrust comparable to FJRT Cheetah at combat flight speeds
// Dry thrust: 110 to 150
// Wet thrust: 157 to 197, heat production lowered as on Cheetah
// Velocity curves not modified
// ... other than adding Mach 3 limit which was missed; temp patch, will be fixed for final engine release.

@PART[SAE_tfj_229_avc]:FINAL
{
    @title = FJRT / TFJ-229 "Talon" Afterburning Turbofan

    @MODULE[ModuleEnginesFX],0
    {
        @maxThrust = 150
    }
    @MODULE[ModuleEnginesFX],1
    {
        @maxThrust = 197
        @heatProduction = 45
        
    }
}


	name = ModuleECMJammer
	alwaysOn = false		
	resourceDrain = 9
    jammerStrength = 2400
    lockBreaker = true
    lockBreakerStrength = 1000
    rcsReduction = false		
	rcsReductionFactor = 0.0
}

MODULE
{
  name = ModuleCloakingDevice
  opticalReductionFactor = 1.0 	// 1 is 100% visibility, 0 is 0% visibility; values greater than 1 allowed

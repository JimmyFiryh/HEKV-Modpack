	title = Tactical Laser System Pod (TLS)
	manufacturer = Kazamaru Aerospace
	description = A special anti-air and anti-ground weapon that hits targets with a high output laser, causing major damage.  Unlike its predecessor, it has no gimbal, but trades accuracy for far more damage. Its speed means that, if fired accurately, it cannot be evaded. It has a fixed period of firing time, which can be used to continuously target a single point or be used to sweep across a wide area. The unit contains a built in battery to alleviate some of the strain on your power system.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision



PART
{
// Kerbal Space Program - Part Config
// 
// 

// --- general parameters ---
name = PointDefenseMG
module = Part
author = Suicidalinsanity, Kaz

// --- asset parameters ---
mesh = Model.mu
rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, 0.0, 0, 0, -1, 0, 1
node_stack_bottom = 0.0, 0.0, 0, 0, -1, 0, 1


// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 3500
category = none
subcategory = 0
title = Point-Defence Machine Gun
manufacturer = Kazamaru Aerospace
description = Initially designed for ground-based use, this system has grown to occasionally be mounted on larger craft to assist in shooting down incomming missiles.  Uses .50 Cal Ammo.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1

// --- standard part parameters ---
mass = 0.15
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 60
maxTemp = 3600

stagingIcon = SOLID_BOOSTER

MODULE
{
	name = ModuleTurret
	
	yawTransformName = Mount
	pitchTransformName = BallTurret
	
	pitchSpeedDPS = 720
	yawSpeedDPS = 720
	
	minPitch = -90
	maxPitch = 90
	yawRange = 360
	
	smoothRotation = true
	smoothMultiplier = 10
}

MODULE
{
	name = ModuleWeapon
	shortName = APS
	
	fireTransformName = fireTransform
	
	hasDeployAnim = false
	
	hasFireAnimation = true
	fireAnimName = PDCFire
	spinDownAnimation = true
	SpoolUpTime = 0.1
	roundsPerMinute = 2000
	maxDeviation = 0.05
	maxEffectiveDistance = 2500
	maxTargetingRange = 3000

	ammoName = 50CalAmmo
	bulletType = 12.7mmHEBullet
	requestResourceAmount = 1

	hasRecoil = true
	onlyFireInRange = true
	bulletDrop = false

	weaponType = ballistic
	isAPS = true //turns weapon into independent point defense weapon
	APSType = missile //choose from ballistic, missile, or omni

	tracerLength = 0

	oneShotWorldParticles = true

	maxHeat = 3600
	heatPerShot = 80 //PD cannons till affected by heat/reload, use this to tune how long they can fire for
	heatLoss = 920

	fireSoundPath = BDArmoryExtended/Parts/PointDefenseMG/sounds/pdc
	overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
	oneShotSound = false
	explModelPath = BDArmory/Models/explosion/30mmExplosion
	explSoundPath = BDArmory/Sounds/subExplode
}
}

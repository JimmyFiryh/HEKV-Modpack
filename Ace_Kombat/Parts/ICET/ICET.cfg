PART
{
	// --- general parameters ---
	name = ICET
	module = Part
	author = K.Yeon, Kaz
	tags = opt size1
	
	// --- asset parameters ---
	scale = 1.0
	rescaleFactor = 1

	MODEL
	{
		model = Ace_Kombat/Parts/ICET/ICET
	}
	
	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_stack_top = 0.0, 0.61859, 0.0, 0.0, 1.0, 0.0
	
	// --- editor parameters ---
	TechRequired = nuclearPropulsion
	entryCost = 58050
	cost = 34200
	category = Engine
	subcategory = 0
	title = KA-XGP-15A2 "ICE-T"
	manufacturer = Kazamaru Aerospace Propulsion Division
	description = The "ICE-T" Engine, or Ionized Combustion Emission Turbofan Engine, is the next step in hyper-effective aircraft engines, built for the next generation of airframes. The engine features a miniaturized fuel cell (mixing liquid fuel and oxygen in the atmosphere) that produces electric charge at a high rate, and that electricity is then fed into the exhaust gasses, ionizing them, and using the electricity to force the ionized exhaust out at an even faster velocity than previous turbofan engines.  R&D simplifies this by saying it's like a turbofan engine and a plasma or ion thruster had a futuristic baby.  This combination means the engine is capable of enormous thrust without use of an afterburner system.

	
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,0

	
	// --- standard part parameters ---
	mass = 1.0
	dragModelType = default 
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 1
	crashTolerance = 20 
	maxTemp = 3600
	SkinMaxTemp = 3600
	emissiveConstant = 1.90
	heatConductivity = 0.001 //They have built in insulators
	skinInternalConductionMult = 2000
	thermalMassModifier = 2.5
	bulkheadProfiles = size1, srf
	
	MODULE
	{
		name = FXModuleAnimateThrottle
		animationName = ari_engine
		dependOnEngineState = True
		responseSpeed = 0.04
	}
	
	

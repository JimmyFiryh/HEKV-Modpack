PART
{
	// Kerbal Space Program - Part Config
	//
	//

	// --- general parameters ---
	name = fjrt8AAMPod
	module = Part
	author = BahamutoD, SuicidalInsanity, Kaz

	// --- asset parameters ---
	mesh = model.mu
	rescaleFactor = .6


	// --- node definitions ---
	node_attach = 0.0, 0.7, 0.0168, 0, 1, 0, 0
	node_stack_top = 0.0, 0.7, 0.0168, 0, 1, 0, 0
	//node_stack_rail = 0.0, 0.042, 0.0168, 0, 1, 0, 0
	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 100
	cost = 50
	category = none
	bdacategory = Missile turrets
	subcategory = 0
	bulkheadProfiles = srf
	title = 8AAM Pod
	manufacturer = Kazamaru Aerospace
	description = An aerodynamic pod designed to hold several munitions for rapid response and attack scenarios.  Each missile is capable of tracking a target independantly of one another, or firing on a few targets at the same time.  Designed to be mounted in pairs for 8 simultaneous shots.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 0.3
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 60
	maxTemp = 3600

MODULE
	{
		name = MissileLauncher

		shortName = 8AAM
		thrust = 55 //Used by Weaponmanager for selection, doesn't need to mirror submunition
		guidanceActive = true
		maxTurnRateDPS = 13.5 // This + thrust used for Weapon selection, 
		optimumAirspeed = 1500 //used to perform DLZ checks, which controls when it will be launched
		missileType = missile
		homingType = aam //subMunition homing type

		targetingType = inertial
		inertialDrift = 0
		gpsUpdates = 0
		terminalManeuvering = true
        terminalGuidanceShouldctivate = true
		terminalGuidanceType = radar
		terminalGuidanceDistance = 3000
        activeRadarRange = 3000
		maxOffBoresight = 90
		uncagedLock = true  
		minStaticLaunchRange = 2000 //set these to submunition values
		maxStaticLaunchRange = 50000 

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false
	}


MODULE
{
     name = MultiMissileLauncher
	deployAnimationName = 4AAMPod
	launchTransformName = launchers 								//name of launch transforms
	subMunitionName = fjrt-aim-120d									//name of missile launched by MML. leave blank if a VLS or similar and missile is selected by player
	subMunitionPath = FJRTMissilePack/Parts/TCA_Missiles_Set00/AIM-120D_TCA	//leave blank if a VLS or similar
	salvoSize = 4 													//missiles fired per Fire command, if blank will fire all tubes
	isClusterMissile = false 										//is this a standard missile with cluster submunition warhead?
	isMultiLauncher = true 											//is this a multi-missile pod?
	useSymCounterpart = true 										//if launcher has a symmetry twin, have it fire as well?
	overrideReferenceTransform = true 								//use vessel prograde for referenceTranform (used for aiming) instead of part's transform if launcher expected to be canted/top-launch
	//RailNode = rail 												//Attachnode for VLS, this is the node that a missile is to be attached to to load it into the VS
	launcherCooldown = 0 											// time in seconds before launcher is ready to launch the next salvo. Keep 0 if salvosize = entire launcher
	rippleRPM = 130 												// firerate for salvo
	tntMass = 12.25
	offset = 1.25  													// offset missile should spawn in front of launcher transform, in meters
}

MODULE
{
	name = ModuleMissileRearm
	reloadTime = 16 				//time, in seconds
	AccountForAmmo = false 			//ammo carried has mass/cost?
	MissileName = fjrt-aim-120d		//name of submunition as it appears in the .cfg name field - e.g. "bahaAim120"
	ammoCount = 8 					//starting ammo
	maxAmmo = 8 					//maximum ammo carried? uses 1 ammo per submunition if a MultiMissilelauncher
}

}

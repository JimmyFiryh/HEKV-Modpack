

PART
{
    // --- general parameters ---
    name = QAAM
    module = Part
    author = Kaz

    // --- asset parameters ---
    mesh = AIM9X.mu
    rescaleFactor = 0.7


      // --- node definitions ---
    node_attach = 0.0, 0.06188124, 0, 0, 1, 0, 0
    node_stack_top = 0.0, 0.06188124, 0, 0, 1, 0, 0


    // --- editor parameters ---
    TechRequired = precisionEngineering
    entryCost = 2100
    cost = 2000
    category = Utility
    subcategory = 0
    title = Quick-Maneuver Air to Air Missile
    manufacturer = Kazamaru Aerospace
    description = The Quick Maneuver Air-to-Air Missile, or QAAM for short, is a short-range all-aspect missile. It has a short range compared to standard missiles, but the difference is that the QAAM has vastly superior agility when compared to most munitions.  As a result, if it misses the target, the missile will attempt to turn around and chase the target again until it runs out of fuel.  While not as powerful as standard missiles, it makes up for this in sheer tenacity. Like an angry dog, this missile will try to stick to your heels until it bites.
    // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,0,0,1

    // --- standard part parameters ---
    mass = 0.07
    dragModelType = default
    maximum_drag = 0.01
    minimum_drag = 0.01
    angularDrag = 2
    crashTolerance = 5
    maxTemp = 3600


    MODULE
    {
        name = MissileLauncher

        shortName = QAAM            //Missile name in BDA Weapon Manager

        // LAUNCHING PARAMETERS
        thrust = 14                     //KN thrust during boost phase
        cruiseThrust = 24               //thrust during cruise phase
        dropTime = 0.2                  //how many seconds after release until engine ignites
        boostTime = 1                	//seconds of boost phase
        cruiseTime = 7.5                 //seconds of cruise phase
        guidanceActive = true           //missile has guidanceActive
        maxTurnRateDPS = 108             //thrust+maxTurnRateDPS is the value used by the AI to prioritize missiles over each other. maxTurnRateDPS, in degrees per second, ONLY affects flight of RCS missiles like the HEKV1
        decoupleSpeed = 10
        decoupleForward = false
        
        // ENGAGE PARAMETERS
        minStaticLaunchRange = 0        // minimum launch range in meters assuming craft don't move, final min launch distance is dynamically calculated based on target/launching craft speeds
        maxStaticLaunchRange = 3600    // maximum launch range in meters assuming craft don't move, final max launch distance is dynamically calculated based on target/launching craft speeds

        engageAir = true
        engageMissile = false
        engageGround = false
        engageSLW = false
        
                
        // EFFECTS
        audioClipPath = BDArmory/Sounds/rocketLoop
        exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
        boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
        boostExhaustTransformName = exhaustTransform
        boostTransformName = boostTransform
        
        // FLIGHT PARAMETERS
        optimumAirspeed = 950           //deals with how missile leads the target and calculation of turn radius for dynamic launch zone calculation, should match the max speed of your missile

        aero = true                     //Missile has aerodynamics
        liftArea = 0.005                //increases lift which helps with manuevering and turning, but also increases drag
        steerMult = 20                  //big number = steer harder...
        maxTorque = 80                  //ammount of torque that will be applied to the missile for turning
        maxAoA = 55                     //max AoA missile can turn at, will limit missile's turn radius below what is possible with maxTorque if set too low
        aeroSteerDamping = 12
        torqueRampUp = 50
        
        // SEEKER PARAMETERS
        missileType = missile
        homingType = aam                //air to air missile different types are AAM, AGM, Cruise, Ballistic, ProNav, and AugProNav
        targetingType = radar
        maxOffBoresight = 300           //maximum angle, from the boresight, that the missile can track the target. This also controls how the missile can launch off boresight. When launched from the air at another air target with uncagedLock = false, launch off boresight is at 0.35*maxOffBoresight, otherwise it is at 0.75*,maxOffBoresight (uncagedLock = true OR either launching craft or target is landed/splashed).
		uncagedLock = true              // true: Allows missile to be cued to a radar target, also controls launch conditions, see above
        lockedSensorFOV = 6             // How much the seeker can see in the direction it is looking (in terms of angle cone).
        
        radarLOAL = true
        activeRadarRange = 5000
		
		chaffEffectivity = 1.0
        
        activeRadarLockTrackCurve
		{
            key = 0	0
			key = 5	0
            key = 10 0.1	
            key = 15 0.2
		}               
		
    }

    MODULE
    {
        name = BDExplosivePart
        tntMass = 6.66
    }
}

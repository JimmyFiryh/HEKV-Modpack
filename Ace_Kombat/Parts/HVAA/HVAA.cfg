PART
{
	// Kerbal Space Program - Part Config
	// 
	// 

	// --- general parameters ---
	name = HVAA
	module = Part
	author = BahamutoD & Kerwis & Kaz

	// --- asset parameters ---
	mesh = HVAA.mu
	rescaleFactor = .7


	// --- node definitions ---
	node_attach = 0.0, 0.09, -0.984, 0, 1, 0, 0
	node_stack_top = 0.0, 0.09, -0.175, 0, 1, 0, 0


	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 2100
	cost = 950
	category = Utility
	subcategory = 0
	title = Hyper-Velocity Anti-Air (HVAA) Missile
	manufacturer = Kazamaru Aerospace
	description = Large, high-speed air-to-air IR missiles that make mincemeat of slow-witted targets. Their decent tracking combined with an ability to accelerate exceptionally quickly makes them very useful at medium ranges against fleeing enemies. However, the space that would normally be reserved for the cruise motor was removed to achieve this. After its booster burns out, this missile will rapidly become less of a threat and more of a non-factor.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	// --- standard part parameters ---
	mass = 0.14
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 6600


	MODULE
	{
		name = MissileLauncher

		shortName = HVAA

		thrust = 150 //KN thrust during boost phase
		cruiseThrust = 20 //thrust during cruise phase
		dropTime = 0 //how many seconds after release until engine ignites
		boostTime = 6 //seconds of boost phase
		cruiseTime = 10 //seconds of cruise phase
		guidanceActive = true //missile has guidanceActive
		maxTurnRateDPS = 45 //degrees per second

		decoupleSpeed = 10
		decoupleForward = false
		
		CruisePredictionTime = 5

		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
				
		boostTransformName = boostTransform
		boostExhaustTransformName = boostTransform
		
		optimumAirspeed = 1969

		aero = true
		liftArea = 0.002
		steerMult = 14
		maxTorque = 85
		maxAoA = 45
		aeroSteerDamping = 10

		missileType = missile
		homingType = aam
		targetingType = heat
		heatThreshold = 10
		maxOffBoresight = 90
		lockedSensorFOV = 6
		
		uncagedLock = true
		
		lockedSensorFOVBias
		{
			key = 0 	1.00 		// Highest weighing on centerline
			key = 0.5 	0.95 	
			key = 1 	0.90 
			key = 1.5 	0.85 
			key = 2 	0.80 
			key = 2.5 	0.75 
			key = 3 	0.70 		// 30% lower weighting at edge of sensor FOV
			key = 10	0.00		// Beyond Sidewinder FOV, provided for example purposes for large sensor FOV missiles
		}
		lockedSensorVelocityBias
		{
			key = 0 	1			// Highest weighing for target/flare travelling in same direction as tracked target
			key = 20 	0.5
			key = 45 	0.25
			key = 90	0.0			// ignore flares travelling perpendicular to target or in opposite direction
		}
		
		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false

		minStaticLaunchRange = 700
		maxStaticLaunchRange = 12000
	  
	  flareEffectivity = .6
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 10
	}

}

PART
{
	// Kerbal Space Program - Part Config
	//
	//

	// --- general parameters ---
	name = HPAA
	module = Part
	author = BahamutoD, Kaz

	// --- asset parameters ---
	mesh = model.mu
	rescaleFactor = .3


	// --- node definitions ---
	node_attach = 0.0, 0.1343161, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.1343161, 0, 0, 1, 0, 0
	node_stack_bottom = 0, 0, -2.900545, 0, 0, -1, 0

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 2100
	cost = 4000
	bdacategory = Missiles
	category = Utility
	subcategory = 0
	bulkheadProfiles = srf
	title = High-Power Air-to-Air Missile (HPAA)
	manufacturer = Kazamaru Aerospace
	description = These missiles are made to act as close-range, heat-seeking, anti-air projectiles.  They are equipped with an increased warhead yield compared to standard munitions, but can't be fired at long ranges due to a lack of fuel space within the body of the missile.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	// --- standard part parameters ---
	mass = 0.097
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600


	MODULE
	{
		name = MissileLauncher

		shortName = HPAA

		thrust = 50 //KN thrust during boost phase
		cruiseThrust = 20 //thrust during cruise phase
		dropTime = 0 //how many seconds after release until engine ignites
		boostTime = 0.2 //seconds of boost phase
		cruiseTime = 10 //seconds of cruise phase
		guidanceActive = true //missile has guidanceActive
		maxTurnRateDPS = 30 //degrees per second

		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostExhaustTransformName = boostTransform
		boostTransformName = boostTransform

		optimumAirspeed = 910

		aero = true
		liftArea = 0.0019
		steerMult = 8
		maxTorque = 65
		maxAoA = 55
		aeroSteerDamping = 8
		
		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false

		homingType = aam
		missileType = missile
		targetingType = heat

		uncagedLock = true

        heatThreshold = 10
        maxOffBoresight = 120
		lockedSensorFOV = 4
		
		lockedSensorFOVBias
		{
			key = 0 	1.00 		// Highest weighing on centerline
			key = 0.5 	0.95 	
			key = 1 	0.90 
			key = 1.5 	0.85 
			key = 2 	0.80 
			key = 2.5 	0.75 
			key = 3 	0.70 		// 30% lower weighting at edge of sensor FOV
			key = 10	0.00		// Beyond Sidewinder FOV, provided for example purposes for large sensor FOV missiles
		}
		lockedSensorVelocityBias
		{
			key = 0 	1			// Highest weighing for target/flare travelling in same direction as tracked target
			key = 20 	0.5
			key = 45 	0.25
			key = 90	0.0			// ignore flares travelling perpendicular to target or in opposite direction
		}
				
		minStaticLaunchRange = 0
		maxStaticLaunchRange = 7000
	  
	  flareEffectivity = .6
	  
	}
	MODULE
	{
		name = BDExplosivePart
		tntMass = 17
	}
	

}

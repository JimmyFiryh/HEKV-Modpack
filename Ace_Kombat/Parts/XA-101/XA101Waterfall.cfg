@PART[KA-XA101]:NEEDS[Waterfall]:FOR[StockWaterfallEffects]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  	EFFECTS
    {

		XA_running_dry
		{
			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/Jet2
				volume = 0.0 0.0
				volume = 0.05 0.9
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 0.05 0.6
				pitch = 0.33 1.0
				pitch = 1.0 1.2
				loop = true
			}
		}

		XA_power_dry
		{
			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/fighter_idle
				volume = 0.0 0.0
				volume = 0.05 0.4
				volume = 1.0 0.9
				pitch = 0.0 0.8
				pitch = 1.0 1.4
				loop = true
			}
		}
		XA_running_wet
		{
			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/Jet2
				volume = 0.0 0.0
				volume = 0.05 0.9
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 0.05 0.6
				pitch = 0.33 1.0
				pitch = 1.0 1.2
				loop = true
			}
		}
		XA_power_wet
		{

			AUDIO
			{
				channel = Ship
				clip = Ace_Kombat/Sounds/afterburner2
				volume = 0.0 0.0
				volume = 0.1 0.3
				volume = 1.0 0.5
				pitch = 0.0 0.5
				pitch = 0.33 0.8
				pitch = 1.0 1.5
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = smokePoint
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*],0
	{
	  %powerEffectName = XA_power_dry
	  %spoolEffectName = XA_running_dry
	}
@MODULE[ModuleEngines*],1
	{
	  %runningEffectName = XA_power_wet
	  %spoolEffectName = XA_running_wet
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = XADry
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = Dry
		responseRateUp = 0.01
		responseRateDown = 0.01
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	TEMPLATE
    {
      templateName = ModSaturnDry
      overrideParentTransform = T
      position = 0,0,1.2
      rotation = 0, 0, 0
      scale = 1.4, 1.4, 1
    }
  }
  
MODULE
  {
    name = ModuleWaterfallFX
    moduleID = XAWet
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
	  linkedTo = throttle
	  engineID = Wet
	  responseRateUp = 0.001
      responseRateDown = 0.016
    }
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
    TEMPLATE
    {
      templateName = ModSaturnWet
      overrideParentTransform = T
      position = 0,0,1
      rotation = 0, 0, 0
      scale = 1.05, 1.05, 1.2
    }

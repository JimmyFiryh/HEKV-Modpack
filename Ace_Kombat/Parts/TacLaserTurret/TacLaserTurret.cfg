PART
{
	// Kerbal Space Program - Part Config
	//
	//

	// --- general parameters ---
	name = TacLaserTurret
	module = Part
	author = BahamutoD, Kaz

	// --- asset parameters ---
	mesh = model.mu
	rescaleFactor = 0.55


	// --- node definitions ---
	node_attach = 0.0, -0.6017585, 0, 0, -1, 0, 1


	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 2100
	cost = 3500
	category = Utility
	subcategory = 0
	bulkheadProfiles = srf
	title = Tactical Laser Turret
	manufacturer = Kazamaru Aerospace
	description = A special anti-air and anti-ground weapon refined from recovered KHI tech that hits targets with a high output laser, causing major damage.  Unlike its predecessor, it has been mounted in a turret for maximum damage. Its speed means that, if fired accurately, it cannot be evaded. It has a fixed period of firing time, which can be used to continuously target a single point or be used to sweep across a wide area. As it was designed to be used on larger craft, it does not contain an internal supply of power, meaning it can potentially strain your power system if not adequately fed.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	// --- standard part parameters ---
	mass = 2
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 125
	maxTemp = 3600

	stagingIcon = SOLID_BOOSTER


	MODULE
	{
		name = ModuleTurret

		yawTransformName = aimYaw
		pitchTransformName = aimPitch

		pitchSpeedDPS = 90
		yawSpeedDPS = 90

		minPitch = -4

		yawRange = 360

		smoothRotation = true
		smoothMultiplier = 20

		audioPath = BDArmory/Sounds/hydraulicLoop
		maxAudioPitch = 0.65
		minAudioPitch = 0.355
		maxVolume = 0.55
	}

	MODULE
	{
	name = ModuleWeapon
	

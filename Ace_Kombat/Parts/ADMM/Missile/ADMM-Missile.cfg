PART
{
	name = fjrtADMMRound
	module = Part
	author = SuicidalInsanity, Kaz

	MODEL
	{
		model = Ace_Kombat/Parts/ADMM/Missile/Model_RD
		texture = CLSrocket, Ace_Kombat/Parts/ADMM/Missile/CLSrocket
	}
	
	rescaleFactor = 1
	TechRequired = Unresearcheable
	entryCost = 0
	cost = 0
	category = none

	title = ADMM Missile
	manufacturer = Kazamaru Aerospace
	description = A small, short range Air Suppression Missile intended to achieve through volume of munitions what a single larger, heavier, and more capable missile does singly, but more cheaply and harder to evade.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	// --- standard part parameters ---
	mass = 0.012
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 1
	crashTolerance = 5
	maxTemp = 3600


    MODULE
    {
        name = MissileLauncher

        shortName = ADMM

	thrust = 10                     //KN thrust during boost phase
    cruiseThrust = 4                //thrust during cruise phase
    dropTime = 0.2                  //how many seconds after release until engine ignites
    boostTime = 0.5                	//seconds of boost phase
    cruiseTime = 11                 //seconds of cruise phase
    guidanceActive = true           //missile has guidanceActive
	cruiseDelay = 0 				//seconds of delay between boost and cruise
	maxTurnRateDPS = 60             //thrust+maxTurnRateDPS is the value used by the AI to prioritize missiles over each other. maxTurnRateDPS, in degrees per second, ONLY affects flight of RCS missiles
	
	  deployAnimationName = GRocketDeploy
	  deployTime = 0.09

	  decoupleSpeed = 10
	  decoupleForward = true

	  optimumAirspeed = 600

	homingType = aampure
	missileType = missile
	targetingType = radar
	uncagedLock = true 
	
	radarLOAL = true
    activeRadarRange = 7000
		    
        activeRadarLockTrackCurve
		{
            key = 0	0
			key = 5 0
            key = 10 0.1	
            key = 15 0.2
		} 
	
	maxOffBoresight = 300
	uncagedLock = true
	lockedSensorFOV = 6 
	
	
	DetonationDistance = 0

	maxAoA = 25

	aero = true
	liftArea = 0.0010
	steerMult = 0.8
	maxTorque = 10
	torqueRampUp = 50
	aeroSteerDamping = 0.5

	minStaticLaunchRange = 1000
	maxStaticLaunchRange = 7000
	
	audioClipPath = BDArmory/Sounds/rocketLoop
	boostClipPath = BDArmory/Sounds/rocketLoop
	exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
	boostTransformName = boostTransform

	engageAir = true
	engageMissile = false
	engageGround = true
	engageSLW = false

	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 2.0
		warheadType = Standard
	}


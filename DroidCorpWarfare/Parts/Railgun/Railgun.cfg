BULLET
{
    name = CordiumBullet
	DisplayName = Cordium Bullet
	caliber = 105
	bulletVelocity = 10000
	bulletMass = 1.25
	//HE Bullet Values
	explosive = None
	incendiary = False
	tntMass = 0
	fuzeType = None 
	projectileColor = 122, 170, 240, 128
	fadeColor = False
	startColor = 122, 170, 240, 0
	projectileCount = 1
	apBulletMod = 1
	bulletDragTypeName = AnalyticEstimate	
}


PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = CordiumRailgun
module = Part
author = SuicidalInsanity

// --- asset parameters ---
mesh = Model.mu
rescaleFactor = 2


// --- node definitions ---
node_attach = 0.0, -0.06105912, 0.05663621, 0, -1, 0, 1


// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 2100
category = Utility
subcategory = 0

title = Cordium Test
manufacturer = Kerbelka Heavy Industries
description = ...glittering C-beams in the dark, attack ships on fire in the Belt of Orion...
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
// --- standard part parameters ---
mass = 0.5
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 60
maxTemp = 3600
stagingIcon = SOLID_BOOSTER
bulkheadProfiles = srf

MODULE
{
	name = ModuleTurret
	
	yawTransformName = yawTransform
	pitchTransformName = pitchTransform
	
	pitchSpeedDPS = 90
	yawSpeedDPS = 90
	
	minPitch = 45
	maxPitch = 45
	yawRange = 90
	
	smoothRotation = true
	smoothMultiplier = 10
}

MODULE
	{
		name = ModuleWeapon
		shortName = Cordium Railgun

		fireTransformName = fireTransform

		hasDeployAnim = false
		hasFireAnimation = false

		roundsPerMinute = 6
		maxDeviation = 0.01
		maxEffectiveDistance = 30000
		maxTargetingRange = 50000 //should be [cordiumDuration * bulletVelocity] for proper trail duration

		weaponType = ballistic
		bulletType = CordiumBullet
		ammoName = CannonShells
	
		ChargeTime = 0 //how long does it take to charge before it can fire (railguns/DEWs/etc)
		ChargeEachShot = True //weapon must charge before each shot
		requestResourceAmount = 1
		secondaryAmmoName = ElectricCharge
		secondaryAmmoPerShot = 50 //requires 50 EC in addition to available ammo to fire
		shellScale = 0.9
			
		hasRecoil = false //can be true, but heavy hypersonic projectiles produce a lot of impulse, and KSP surface attach joint strength being what it is...
		onlyFireInRange = true
		bulletDrop = false //can be either, cordium AoE works with arcing trajectories
		cordiumDuration = 5 //how long trail will cause AoE damage after bullet has passed
		hurtDiameter = 10 //diameter in meters of the AoE
		cordiumDPS = 100 //damage per second sustained from contact w/ AoE

		tracerOverrideWidth = true //use .cfg values for tracer widths instead of calculated from bullet caliber
		tracerLength = 0
		beamScalar = 0.005 //smoke texture stretchiness. lower number is less scrunched
		tracerDeltaFactor = 2.75
		tracerInterval = 0
		tracerStartWidth = 1
		tracerEndWidth = 1
		nonTracerWidth = 1

		autoProxyTrackRange = 1200
		
		fireSoundPath = BDArmory/Parts/browninganm2/sounds/fire
		overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat

		bulletTexturePath = DroidCorpWarfare/Parts/Railgun/bullet
		oneShotSound = true
		showReloadMeter = true
		maxHeat = 3600
		heatPerShot = 115
		heatLoss = 825

		//explosion
		explModelPath = BDArmory/Models/explosion/30mmExplosion
		explSoundPath = BDArmory/Sounds/subExplode
		//cordium rounds need a smoketexture set up
		smokeTexturePath = DroidCorpWarfare/Parts/Railgun/cordium

	}
}

PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = dcm_m61vulcan
module = Part
author = Android, Stardust

// --- asset parameters ---
MODEL
{
    model = DroidCorpMunitions/SharedTextures/M61_TCA
    texture = DroidCorpMunitions/SharedTextures/TexAtlas_M61
    // scale = 0.75, 0.75, 0.75
}
rescaleFactor = 0.75

// --- node definitions ---
node_attach = 0.0, -0.01, 0, 0, -1, 0, 1


// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 950
category = Utility
subcategory = 0
bulkheadProfiles = srf
title = M61A2 Vulcan 20mm Cannon
manufacturer = DroidCorp Munitions and Systems
description = 20mm aircraft cannon. Entered service in the US in 1959. Well ahead of its time, the six-barreled Vulcan is still considered one of, if not the best aircraft gun in the world. It combines high velocity rounds with an exceptionally high rate of fire to help the pilot hit their target as consistently as possible.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1

// --- standard part parameters ---
mass = 0.092
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 60
maxTemp = 3600

stagingIcon = SOLID_BOOSTER

MODULE
{
	name = ModuleWeapon
	shortName = M61A2

	fireTransformName = fireTransform

	hasDeployAnim = false
    hasFireAnimation = true
    fireAnimName = M61_FireAnim
    spinDownAnimation = true

	SpoolUpTime = 0.2

	roundsPerMinute = 6000
	maxDeviation = 0.2
	maxEffectiveDistance = 2500
	maxTargetingRange = 2500

	ammoName = 20x102mmAmmunition
	bulletType = 20x102mmHEFI-T
	requestResourceAmount = 1

	hasRecoil = true
	onlyFireInRange = false
	bulletDrop = true
	useRippleFire = false

	weaponType = ballistic

	//oneShotWorldParticles = true

	maxHeat = 3000
	heatPerShot = 16
	heatLoss = 1000

	fireSoundPath = DroidCorpMunitions/Parts/Gun/M61/fire2
	overheatSoundPath = DroidCorpMunitions/Parts/Gun/M61/end2
	oneShotSound = false

	explModelPath = BDArmory/Models/explosion/30mmExplosion
	explSoundPath = BDArmory/Sounds/subExplode
}

MODULE
{
    name = ModulePartVariants
    baseVariant = Shrouded
    useMultipleDragCubes = false
    VARIANT
    {
        name = Shrouded
        displayName =  Shrouded
        primaryColor = #aaaaaa
        secondaryColor = #ffffff
        sizeGroup = Shrouded
        disabledAnimations = 
        GAMEOBJECTS
        {
            M61_BodyMotor = true
            M61_Rotator = true
            M61_Shroud = true
        }
    }		
    VARIANT
    {
        name = Unshrouded
        displayName = Unshrouded
        primaryColor = #ffffff
        secondaryColor = #ffffff
        sizeGroup = Unshrouded
        disabledEvents = 
        GAMEOBJECTS
        {
            M61_BodyMotor = true
            M61_Rotator = true
            M61_Shroud = false
        }			
    }	
}

MODULE
{
    name = HitpointTracker
    ArmorThickness = 10
    maxHitPoints = 700
    ExplodeMode = Never
}

}

PART
{
    // Kerbal Space Program - Part Config

    // --- general parameters ---
    name = dcm_sraam
    module = Part
    author = SI, Android

    // --- asset parameters ---
	mesh = SRAAM.mu
	rescaleFactor = 0.75
    
	// --- node definitions ---
	node_attach = 0.0, 0.083, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.083, 0, 0, 1, 0, 0

    // --- editor parameters ---
    TechRequired = precisionEngineering
    entryCost = 1400
    cost = 1200
    category = Utility
    subcategory = 0
    bulkheadProfiles = srf
    title = SRAAM IR AAM
	manufacturer = DroidCorp Munitions and Systems
	description = Infrared-guided rear-aspect air-to-air missile. Began development in the UK in 1968. The SRAAM was intended as a theoretical replacement for the Sidewinder in British service, designed for unmatched dogfight performance. The SRAAM is highly maneuverable, with every other performance category rather lacking. A strange quirk of the seeker is that it is sensitive enough to acquire targets in the front aspect at close ranges despite being a rear-aspect missile on paper.

    // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,0,0,1

    // --- standard part parameters ---
	mass = 0.07
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600


    MODULE
    {
        name = MissileLauncher

        shortName = SRAAM
		
        // LAUNCHING PARAMETERS
        thrust = 10.8
        cruiseThrust = 0
        dropTime = 0.1
        boostTime = 5.75
        cruiseTime = 0
        guidanceActive = true
        maxTurnRateDPS = 200
        decoupleSpeed = 10
        decoupleForward = true
		
		useFuel = true
		boosterFuelMass = 0.035
		cruiseFuelMass = 0
        
        // ENGAGE PARAMETERS
        minStaticLaunchRange = 0
        maxStaticLaunchRange = 2000

        engageAir = true
        engageMissile = false
        engageGround = false
        engageSLW = false
        
        DetonationDistance = 5
        DetonateAtMinimumDistance = False
		UseStaticMaxLaunchRange = True
		adjustableProxyFuze  = false
		fuzeArmingDelay = 0.5
		hasIFF = false
        
        // EFFECTS
        audioClipPath = BDArmory/Sounds/rocketLoop
        exhaustPrefabPath = 
        boostExhaustPrefabPath = BDArmory/Models/exhaust/smallExhaustPrefabII
        boostExhaustTransformName = exhaustTransform
        boostTransformName = exhaustTransform
        deployAnimationName = SRAAM_Deploy

        // FLIGHT PARAMETERS
        optimumAirspeed = 1000

        aero = true
        liftArea = 0.0008
		dragArea = 0.0007
        steerMult = 5
        maxTorque = 15
		maxTorqueAero = 0.0001
        maxAoA = 30
        aeroSteerDamping = 6
        torqueRampUp = 80
		gLimit = 45
        
        // SEEKER PARAMETERS
        missileType = missile
        homingType = aam
        targetingType = heat
        heatThreshold = 150
		frontAspectHeatModifier = 0.5
        maxOffBoresight = 50
		uncagedLock = true
        lockedSensorFOV = 5
		guidanceDelay = 0.2
		flareEffectivity = 1
        
        lockedSensorFOVBias
		{
			key = 0 	1
			key = 2.5 	1
		}
		lockedSensorVelocityBias
		{
			key = 0 	1
			key = 20 	1
			key = 45 	1
			key = 90	1
		}
    }

	MODULE
	{
		name = BDExplosivePart
		tntMass = 4
	}

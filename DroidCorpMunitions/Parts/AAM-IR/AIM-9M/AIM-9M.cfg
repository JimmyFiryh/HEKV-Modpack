PART
{
    // Kerbal Space Program - Part Config

	// --- general parameters ---
	name = dcm_aim9m
	module = Part
	author = Android, Stardust

	// --- asset parameters ---
    MODEL
    {
        model = DroidCorpMunitions/Parts/AAM-IR/AIM-9M/AIM-9M_TCA
        texture = DroidCorpMunitions/Parts/AAM-IR/AIM-9M/TexAtlas_TCA_Missiles_00
    } 
	rescaleFactor = 0.75

    // --- node definitions ---

    title = AIM-9M Sidewinder IR AAM
    manufacturer = DroidCorp Munitions and Systems
    description = Infrared-guided all-aspect air-to-air missile. Entered service in the US in the 1980s. The AIM-9M is the figurehead of 4th generation IR missile technology, focusing on range and seeker quality. Its IRCCM ensures that every shot taken is one the target cannot ignore. It also features a reduced-smoke motor, lowering the range at which a launch can be easily detected.

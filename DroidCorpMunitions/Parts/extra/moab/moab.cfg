PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = dcm_moab
module = Part
author = Android, BD, Cypher

// --- asset parameters ---
mesh = MOAB.mu
rescaleFactor = 0.75

// --- node definitions ---
NODE {
		name = top
		transform = node0
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 1800
cost = 600
category = Utility
subcategory = 0
bulkheadProfiles = srf
title = GBU-43/B MOAB (Massive Ordnance Air Blast) Guided Bomb
manufacturer = DroidCorp Munitions and Systems
description = The MOAB is a large thermobaric GPS-guided bomb designed to airburst above its target. It has an equivalent yield of 11 tons of TNT and a blast radius of almost a kilometer.
tags = CCK-KBF

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 9.85
dragModelType = default
maximum_drag = 0.1
minimum_drag = 0.1
angularDrag = 2
crashTolerance = 15
maxTemp = 3600

MODULE
{
  name = MissileLauncher

  shortName = GBU-43/B

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 1 //how many seconds after release until guidance begins
  boostTime = 0 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = true
  maxTurnRateDPS = 20 //degrees per second

  explModelPath = BDArmory/Models/explosion/explosionLarge
  explSoundPath = BDArmory/Sounds/explode1
  
  deployAnimationName = findeploy
  deployedDrag = 0.005
  deployTime = 0.5

  missileType = bomb
  DetonationDistance = 50
  targetingType = gps
  homingType = AGMBallistic
  optimumAirspeed = 300

  aero = true
  liftArea = 0.2
  steerMult = 10
  maxTorque = 100
  
  minStaticLaunchRange = 0
  maxStaticLaunchRange = 10000

  engageAir = false
  engageMissile = false
  engageGround = true
  engageSLW = false

}

	MODULE
	{
		name = BDModuleNuke
		thermalRadius = 890 //clamps AoE to a max of this distance
		yield = 0.011 // yield, in kilotons
		fluence = 1 //thermal bloom modifier, reduce for less toasty nukes
		isEMP = false // does this generate an EMP
		reportingName = MOAB //weapon name that appears in competition log
		//initial flash
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		//shockwave
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		//fireball
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		//mushroom cloud stalk
		plumeModelPath = 
		//ground scatter
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		//sound
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}
	
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Standard
		useMultipleDragCubes = false
		VARIANT
		{
			name = Standard
			displayName = Standard
			themeName = Standard
			primaryColor = #ffffff
			secondaryColor = #000000
			TEXTURE
			{
				mainTextureURL = DroidCorpMunitions/Parts/extra/moab/MOAB
			}		
		}
	}
}

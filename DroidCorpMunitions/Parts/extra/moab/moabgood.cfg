PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = dcm_moabgood
module = Part
author = Android, BD, Cypher

// --- asset parameters ---
mesh = MOAB.mu
rescaleFactor = 0.4

// --- node definitions ---
NODE {
		name = top
		transform = node0
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 1800
cost = 600
category = Utility
subcategory = 0
bulkheadProfiles = srf
title = XBU-45 BYOB (Big Yield Overwhelming Bust) Guided Bomb
manufacturer = DroidCorp Munitions and Systems
description = The GBU-45 is a fictional miniaturized version of the MOAB which lacks GPS guidance. It has an equivalent yield of 5 tons of TNT (about 10x the power of a Mark 84) and a blast radius of 300 meters.
tags = CCK-KBF

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 3.03
dragModelType = default
maximum_drag = 0.1
minimum_drag = 0.1
angularDrag = 2
crashTolerance = 15
maxTemp = 3600

MODULE
{
  name = MissileLauncher

  shortName = XBU-45

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 3 //how many seconds after release until guidance begins
  boostTime = 2.2 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = false
  maxTurnRateDPS = 20 //degrees per second

  explModelPath = BDArmory/Models/explosion/explosionLarge
  explSoundPath = BDArmory/Sounds/explode1
  
  deployAnimationName = findeploy
  deployedDrag = 0.005
  deployTime = 0.5

  useSimpleDrag = true
  simpleCoD = 0,0,-2
  simpleStableTorque = 5
  rndAngVel = 2
  liftArea = 0
  missileType = bomb
  homingType = none
  
  minStaticLaunchRange = 0
  maxStaticLaunchRange = 10000

  engageAir = false
  engageMissile = false
  engageGround = true
  engageSLW = false

}

	MODULE
	{
		name = BDModuleNuke
		thermalRadius = 300 //clamps AoE to a max of this distance
		yield = 0.005 // yield, in kilotons
		fluence = 1 //thermal bloom modifier, reduce for less toasty nukes
		isEMP = false // does this generate an EMP
		reportingName = BOAB //weapon name that appears in competition log
		//initial flash
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		//shockwave
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		//fireball
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		//mushroom cloud stalk
		plumeModelPath = 
		//ground scatter
		debrisModelPath = 
		//sound
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}
	
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Standard
		useMultipleDragCubes = false
		VARIANT
		{
			name = Standard
			displayName = Standard
			themeName = Standard
			primaryColor = #ffffff
			secondaryColor = #000000
			TEXTURE
			{
				mainTextureURL = DroidCorpMunitions/Parts/extra/moab/MOAB
			}		
		}
	}
}

PART
{
	name = VesperIntake
	module = Part
	author = Balto & Kaz
	//mesh = ChiknaEngine.mu
	rescaleFactor = 1
	node_stack_top = 0.0, 0.515, 0.0, 0.0, 1.0, 0.0
		TechRequired = hypersonicFlight
	entryCost = 18000
	cost = 2250
	category = Aero
	subcategory = 0
	title = Vesper Ramp Intake
	manufacturer = Kazamaru Aerospace Propulsion Devision
	description = The Engineers had a problem.  They greatly liked the shape of the Adjustable Ramp Intake, but were disappointed with the stout configuration.  After many failed ideas, they finally decided to mount either end to rockets going in opposite directions, the pull from which would stretch the intake.  This idea failed spectacularly and took out Jeb's dressing room.  Instead, they settled on just making it from scratch, which worked, but was far less "inspired".
	attachRules = 1,1,1,1,1
	mass = 0.1
	heatConductivity = 0.06 // half default
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.8 // engine nozzles are good at radiating.
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 2400 // = 3600
	fuelCrossFeed = True
	bulkheadProfiles = size1, srf
	
	MODULE
    {
        name = ModuleResourceIntake
        resourceName = IntakeAir
        checkForOxygen = true
        area = 0.009
		intakeSpeed = 15
        intakeTransformName = thrustTransform
		machCurve
		{
			key = 0 0.9 0 0
			key = 1 1.1 0 0
			key = 1.5 0.92 -0.1608955 -0.1608955
			key = 3 0.75 -0.4034287 -0.4034287
			key = 5 0.03 0 0
		}
    }

    RESOURCE
    {
        name = IntakeAir
        amount = 2.0 // dummy value
        maxAmount = 2.0
    }
	MODULE
        	{
                name = TweakScale
                type = free
	}
}

@PART[VesperIntake] //Vesper Intake
{
	%MODULE[HitpointTracker]
	{
		ArmorThickness = 10
		maxHitPoints = 600 //Buff, original was 200, balanced to other intakes
		ExplodeMode = Never
	}
}

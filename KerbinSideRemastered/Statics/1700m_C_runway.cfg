STATIC
{
	mesh = 1700m_C_runway.mu
	module = Part
	static = true
	author = Eskandare
	DefaultLaunchPadTransform = runway_spawn
	title = 1700m Runway C
	category = Runways
	cost = 1500
	manufacturer = Eskandare Heavy Industries
	description = A 1700m with Center designator runway to crash planes on.
	name = KK_1700m_C_runway
	MODULE
	{
		// Mandatory, always the same
		namespace = BWStatics
		name = AutoKourseModule

		// Optional
		digit0Name = number2  // name of the first digit
		digit1Name = number1  // name of the second digit
		headingAdjustment = 0    // adjustment of the heading. set to 180 (or -180) for the other end of the runway
	}
	MODULE
	{
		// Mandatory, always the same
		namespace = BWStatics
		name = AutoKourseModule

		// Optional
		digit0Name = number4  // name of the first digit
		digit1Name = number3  // name of the second digit
		headingAdjustment = 180    // adjustment of the heading. set to 180 (or -180) for the other end of the runway
	}
	MODULE
	{
	namespace = KerbalKonstructs
	name = AnimateOnSunRise

	animationName = rw_17c_lights

	// Optional
	reverseAnimation = False // Play the animation in reverse
	timeWarpAnimation = True // Animation speed scale to timeWarp
	mathHorizontalAngle = True // "Precise" math for the horizon angle, instead of 90°. Probably useful only for static on top of a peak
	horizonAngleOffset = 0 // Offset the horizon angle, can be postive or negative. Can be used alone or with mathHorizontalAngle

	// Very optional :
	//delayLowTimeWarp = 2f // delay between check of the sun position when in physical timeWarp, divided by the current timeWarp rate
	//delayHighTimeWarp = .1f // delay between check of the sun postion when in on-rails timeWarp (x5 and more)
	}
	MODULE
	{
		name = GrasColor
		namespace = KerbalKonstructs
		GrasMeshName = grassTransform // The gras transform name
		// Optional Parameters
		// GrasTextureImage = BUILTIN:/ksc_exterior_terrain_ground // this is the default
		// GrasTextureImage = KerbalKonstructs/Assets/Textures/BW_grass_1
		// UsePQSColor = false // We can use a Lighting depending render of the surface a the computed color from the PQS.
		// UseNormalMap = false // Use additional normal maps
		// GrasTextureNormalMap = Some/Path/to/Image
	}
	MODULE
	{
		name = AdvancedTextures
		namespace = KerbalKonstructs
		transforms = runway
		_MainTex = BUILTIN:/ksc_exterior_terrain_asphalt
	}
	MODULE
    {
        name = AdvancedTextures
        namespace = KerbalKonstructs
        transforms = rr_lightFlare
        newShader = Unlit/Transparent
         _MainTex = KerbinSideRemastered/Statics/runway_light
    }
	MODULE
	{
		name = AdvancedTextures
		namespace = KerbalKonstructs
		transforms = rr_Light
		//newShader = KSP/Scenery/Emissive/Specular
         _MainTex = BUILTIN:/ksp_runway_lights_diff
		 _Emissive = BUILTIN:/ksp_runway_lights_em
	}
}

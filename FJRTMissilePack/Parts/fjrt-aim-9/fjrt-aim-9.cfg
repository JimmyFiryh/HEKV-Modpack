PART
{
    // Kerbal Space Program - Part Config

	// --- general parameters ---
	name = fjrt-aim-9
	module = Part
	author = Android, Stardust

	// --- asset parameters ---
    MODEL
    {
        model = FJRTMissilePack/Parts/TCA_Missiles_Set00/AIM-9M_TCA
        texture = FJRTMissilePack/Parts/TCA_Missiles_Set00/TexAtlas_TCA_Missiles_00
    } 
	rescaleFactor = 0.7

    // --- node definitions ---
    //node_attach = 0.0, 0.06188124, 0, 0, 1, 0, 0
    //node_stack_top = 0.0, 0.06188124, 0, 0, 1, 0, 0
	
	NODE
    {
        name = node0
        transform = node0
        size = 0
        method = FIXED_JOINT //FIXED_JOINT, HINGE_JOINT, LOCKED_JOINT, MERGED_PHYSICS or NO_PHYSICS
    }

    // --- editor parameters ---
    TechRequired = precisionEngineering
    entryCost = 1400
    cost = 1200
    category = Utility
    subcategory = 0
    bulkheadProfiles = srf
    title = FJRT AIM-9M Missile
    manufacturer = Kazamaru Aerospace
    description = Kerthenian short- to medium-range IR missile. It is the baseline against which all other IR missiles are measured.
    // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,0,0,1

    // --- standard part parameters ---
    mass = 0.06062
    dragModelType = default
    maximum_drag = 0.01
    minimum_drag = 0.01
    angularDrag = 2
    crashTolerance = 5
    maxTemp = 3600


    MODULE
    {
        name = MissileLauncher

        shortName = AIM-9M

        thrust = 15 //KN thrust during boost phase
        cruiseThrust = 10 //thrust during cruise phase
        dropTime = 0.2 //how many seconds after release until engine ignites
        boostTime = 7 //seconds of boost phase
        cruiseTime = 20 //seconds of cruise phase
        guidanceActive = true //missile has guidanceActive
        maxTurnRateDPS = 15 //degrees per second
        decoupleSpeed = 10
        decoupleForward = false

        audioClipPath = BDArmory/Sounds/rocketLoop
        exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
        boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
        boostExhaustTransformName = boostTransform
        boostTransformName = boostTransform

        optimumAirspeed = 900

        aero = true
        liftArea = 0.002
        steerMult = 4
        maxTorque = 35
        maxAoA = 25
        //aeroSteerDamping = 4.5
        torqueRampUp = 50

        homingType = aam
        missileType = missile
        targetingType = heat
        heatThreshold = 50   // Distance-adjusted heat of target in order to be detected by missile, lower value results in better detection range
        maxOffBoresight = 60 //maximum angle, from the boresight, that the missile can track the target. This also controls how the missile can launch off boresight. When launched from the air at another air target with uncagedLock = false, launch off boresight is at 0.35*maxOffBoresight, otherwise it is at 0.75*,maxOffBoresight (uncagedLock = true OR either launching craft or target is landed/splashed).
		uncagedLock = true // true: Allows missile to be cued to a radar target, also controls launch conditions, see above
        // allAspect = true // DEPRECIATED - use uncagedLock instead
        lockedSensorFOV = 10 // How much the seeker can see in the direction it is looking (in terms of angle cone).
		
		lockedSensorFOVBias
		{
			key = 0 	1.00 		// Highest weighing on centerline
			key = 0.5 	0.95 	
			key = 1 	0.90 
			key = 1.5 	0.85 
			key = 2 	0.80 
			key = 2.5 	0.75 
			key = 3 	0.70 		// 30% lower weighting at edge of sensor FOV
			key = 10	0.00		// Beyond Sidewinder FOV, provided for example purposes for large sensor FOV missiles
		}
		lockedSensorVelocityBias
		{
			key = 0 	1			// Highest weighing for target/flare travelling in same direction as tracked target
			key = 20 	0.75
			key = 45 	0.3
			key = 90	0.0			// ignore flares travelling perpendicular to target or in opposite direction
		}
        
        minStaticLaunchRange = 0
        maxStaticLaunchRange = 10000

        engageAir = true
        engageMissile = false
        engageGround = false
        engageSLW = false

    }
    MODULE
    {
        name = BDExplosivePart
        tntMass = 6.58
    }
}
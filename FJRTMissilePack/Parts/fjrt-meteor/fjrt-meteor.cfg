PART
{
	// Kerbal Space Program - Part Config
	// 
	// 

	// --- general parameters ---
	name = fjrt-meteor
	module = Part
	author = Android, Stardust

	// --- asset parameters ---
	//mesh = Meteor_TCA.mu
	rescaleFactor = 0.7
    
    MODEL
    {
        model = FJRTMissilePack/Parts/TCA_Missiles_Set01/Meteor_TCA
        texture = FJRTMissilePack/Parts/TCA_Missiles_Set01/tca_missiles_01_tex_atlas
    }


	// --- node definitions ---
	node_attach = 0.0, 0.0885, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.0885, 0, 0, 1, 0, 0
    //NODE
    {
    name = node0
    transform = node0
    size = 0
    method = FIXED_JOINT //FIXED_JOINT, HINGE_JOINT, LOCKED_JOINT, MERGED_PHYSICS or NO_PHYSICS
    }

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 2100
	cost = 950
	category = Utility
	subcategory = 0
	title = FJRT Meteor Missile
	manufacturer = Kazamaru Aerospace
	description = A jointly developed Active Radar Homing missile which uses a ramjet to achieve high speeds and a long range. One of the fastest missiles available, it has often been cited as the most effective missile within competition distances for its sheer acceleration.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	// --- standard part parameters ---
	mass = 0.133
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 6900

MODULE
    {
        name = MissileLauncher

        shortName = Meteor AAM            //Missile name in BDA Weapon Manager

        // LAUNCHING PARAMETERS
        thrust = 20                     //KN thrust during boost phase
        cruiseThrust = 37               //thrust during cruise phase
        dropTime = 0.2                  //how many seconds after release until engine ignites
        boostTime = 1                 //seconds of boost phase
        cruiseTime = 30                 //seconds of cruise phase
        guidanceActive = true           //missile has guidanceActive
        maxTurnRateDPS = 13.5             //thrust+maxTurnRateDPS is the value used by the AI to prioritize missiles over each other. maxTurnRateDPS, in degrees per second, ONLY affects flight of RCS missiles like the HEKV1
        decoupleSpeed = 10
        decoupleForward = false
        
        // ENGAGE PARAMETERS
        minStaticLaunchRange = 2000        // minimum launch range in meters assuming craft don't move, final min launch distance is dynamically calculated based on target/launching craft speeds
        maxStaticLaunchRange = 70000    // maximum launch range in meters assuming craft don't move, final max launch distance is dynamically calculated based on target/launching craft speeds

        engageAir = true
        engageMissile = false
        engageGround = false
        engageSLW = false
        
        DetonationDistance = 10
        DetonateAtMinimumDistance = True
        
        // EFFECTS
        audioClipPath = BDArmory/Sounds/rocketLoop
        exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
        boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
        boostExhaustTransformName = exhaustTransform
        boostTransformName = boostTransform
        
        // FLIGHT PARAMETERS
        optimumAirspeed = 1800           //deals with how missile leads the target and calculation of turn radius for dynamic launch zone calculation, should match the max speed of your missile

        aero = true                     //Missile has aerodynamics
        liftArea = 0.002                //increases lift which helps with manuevering and turning, but also increases drag
        steerMult = 8                  //big number = steer harder...
        maxTorque = 80                  //ammount of torque that will be applied to the missile for turning
        maxAoA = 30                     //max AoA missile can turn at, will limit missile's turn radius below what is possible with maxTorque if set too low
        aeroSteerDamping = 10
        torqueRampUp = 50
        
        // SEEKER PARAMETERS
        missileType = missile
        homingType = aam                //air to air missile different types are AAM, AGM, Cruise, Ballistic, ProNav, and AugProNav
        targetingType = radar
        maxOffBoresight = 90           //maximum angle, from the boresight, that the missile can track the target. This also controls how the missile can launch off boresight. When launched from the air at another air target with uncagedLock = false, launch off boresight is at 0.35*maxOffBoresight, otherwise it is at 0.75*,maxOffBoresight (uncagedLock = true OR either launching craft or target is landed/splashed).
		uncagedLock = true              // true: Allows missile to be cued to a radar target, also controls launch conditions, see above
        lockedSensorFOV = 10             // How much the seeker can see in the direction it is looking (in terms of angle cone).
        
        radarLOAL = true
        activeRadarRange = 15000
        
        activeRadarLockTrackCurve
		{
            key = 0	0
			key = 5 0
            key = 10 0.1	
            key = 15 0.2
			key = 20 0.3
			key = 25 0.4
			key = 30 0.5
			key = 35 0.6
			key = 40 0.7
		}
    }

	MODULE
	{
		name = BDExplosivePart
		tntMass = 11
	}

}

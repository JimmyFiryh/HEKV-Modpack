PART
{
	// Kerbal Space Program - Part Config
	// 
	// 

	// --- general parameters ---
	name = fjrt-pl-10
	module = Part
	author = Android, BD, Kerwis

	// --- asset parameters ---
	mesh = PL10.mu
	rescaleFactor = 0.63


	// --- node definitions ---
	node_attach = 0.0, 0.097, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.097, 0, 0, 1, 0, 0

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 2100
	cost = 950
	category = Utility
	subcategory = 0
	title = FJRT PL-10 Missile
	manufacturer = Kazamaru Aerospace
	description = Short- to medium-range IR missile developed by Dysun. Average stats make for a versatile choice of missile which works well with most competition loadouts.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	// --- standard part parameters ---
	mass = 0.0735
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600


	MODULE
	{
		name = MissileLauncher

		shortName = PL-10 (ASR)

		thrust = 20 //KN thrust during boost phase
		cruiseThrust = 10 //thrust during cruise phase
		dropTime = 1 //how many seconds after release until engine ignites
		boostTime = 7 //seconds of boost phase
		cruiseTime = 15 //seconds of cruise phase
		guidanceActive = true //missile has guidanceActive
		maxTurnRateDPS = 108 //degrees per second

		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = KerbalField/Effects/Exhaust/ExhaustSmallB
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostExhaustTransformName = boostTransform
		boostTransformName = boostTransform

		optimumAirspeed = 1000

		aero = true
		liftArea = 0.0025
		steerMult = 12
		maxTorque = 60
		torqueRampUp = 75
		maxAoA = 30
		aeroSteerDamping = 8
		
		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false

		homingType = aam
		missileType = missile
		targetingType = heat
        allAspect = true
        heatThreshold = 20
	    lockedSensorFOV = 55
        maxOffBoresight = 250
		
		lockedSensorFOVBias
		{
			key = 0 	1.00 		// Highest weighing on centerline
			key = 0.5 	0.95 	
			key = 1 	0.90 
			key = 1.5 	0.85 
			key = 2 	0.80 
			key = 2.5 	0.75 
			key = 3 	0.70 		// 30% lower weighting at edge of sensor FOV
			key = 10	0.00		// Beyond Sidewinder FOV, provided for example purposes for large sensor FOV missiles
			key = 55	0.00
		}
		lockedSensorVelocityBias
		{
			key = 0 	1			// Highest weighing for target/flare travelling in same direction as tracked target
			key = 20 	0.75
			key = 45 	0.3
			key = 90	0.0			// ignore flares travelling perpendicular to target or in opposite direction
		}
		
		flareEffectivity = .7
		
		radarLOAL = false

		minStaticLaunchRange = 0
		maxStaticLaunchRange = 15000
	  
	  
	  
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 7
	}


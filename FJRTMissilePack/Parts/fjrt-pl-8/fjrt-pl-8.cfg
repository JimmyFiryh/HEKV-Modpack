PART
{
// Kerbal Space Program - Part Config
// 
// 

// --- general parameters ---
name = fjrt-pl-8
module = Part
author = Android, BD, Kerwis


// --- asset parameters ---
mesh = PL8B.mu
rescaleFactor = 0.7


// --- node definitions ---
node_attach = 0.0, 0.081, 0, 0, 1, 0, 0
node_stack_top = 0.0, 0.081, 0, 0, 1, 0, 0

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 950
category = Utility
subcategory = 0
title = FJRT PL-8 Missile
manufacturer = Kazamaru Aerospace
description = Short- to medium- range IR missile developed by Dysun; based on a foreign design. Its performance is decidedly average, though its warhead does have an above-average yield.

attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 0.0805
dragModelType = default
maximum_drag = 0.01
minimum_drag = 0.01
angularDrag = 2
crashTolerance = 5
maxTemp = 3600


MODULE
{
  name = MissileLauncher
  shortName = PL-8
  
  thrust = 18 //KN thrust during boost phase
  cruiseThrust = 10 //thrust during cruise phase
  dropTime = 0.2 //how many seconds after release until engine ignites
  boostTime = 6 //seconds of boost phase
  cruiseTime = 15 //seconds of cruise phase
  guidanceActive = true //missile has guidanceActive
  maxTurnRateDPS = 13.5 //degrees per second

  audioClipPath = BDArmory/Sounds/rocketLoop

		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = KerbalField/Effects/Exhaust/ExhaustSmall
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostExhaustTransformName = boostTransform
		boostTransformName = boostTransform

                optimumAirspeed = 980


		aero = true
		liftArea = 0.0015
		steerMult = 8
		maxTorque = 70
		maxAoA = 30
		aeroSteerDamping = 6

		homingType = aam
		missileType = missile
		targetingType = heat
		heatThreshold = 50
		lockedSensorFOV = 10
		maxOffBoresight = 70
		uncagedLock = true
		
		lockedSensorFOVBias
		{
			key = 0 	1.00 		// Highest weighing on centerline
			key = 0.5 	0.95 	
			key = 1 	0.90 
			key = 1.5 	0.85 
			key = 2 	0.80 
			key = 2.5 	0.75 
			key = 3 	0.70 		// 30% lower weighting at edge of sensor FOV
			key = 10	0.00		// Beyond Sidewinder FOV, provided for example purposes for large sensor FOV missiles
		}
		lockedSensorVelocityBias
		{
			key = 0 	1			// Highest weighing for target/flare travelling in same direction as tracked target
			key = 20 	0.75
			key = 45 	0.3
			key = 90	0.0			// ignore flares travelling perpendicular to target or in opposite direction
		}
		
		  engageAir = true
  engageMissile = false
  engageGround = false
  engageSLW = false

		minStaticLaunchRange = 0
		maxStaticLaunchRange = 8000
}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 7.7
	}

}

}

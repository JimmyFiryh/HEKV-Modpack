PART
{
// Kerbal Space Program - Part Config
// 
// 

// --- general parameters ---
name = fjrt-hhq-10
module = Part
author = Android, BD, Kerwis


// --- asset parameters ---
mesh = HHQ10.mu
rescaleFactor = 0.7

// --- node definitions ---
node_attach = 0, 0.045, -0.196, 0, 1, 0, 0
node_stack_top = 0, 0, -0.196, 0, 1, 0, 0


// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 950
category = Utility
subcategory = 0
title = FJRT HHQ-10 Missile
manufacturer = Kazamaru Aerospace
description = Short-range IR missile developed by Dysun. Typically mounted in multiple-launch systems onboard warships, it functions as the smallest and lightest missile in competition.

attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 0.02
dragModelType = default
maximum_drag = 0.01
minimum_drag = 0.01
angularDrag = 2
crashTolerance = 5
maxTemp = 3600


MODULE
{
  name = MissileLauncher
  shortName = HHQ-10
  
  thrust = 10 //KN thrust during boost phase
  cruiseThrust = 5 //thrust during cruise phase
  dropTime = 0.2 //how many seconds after release until engine ignites
  boostTime = 2 //seconds of boost phase
  cruiseTime = 10 //seconds of cruise phase
  guidanceActive = true //missile has guidanceActive
  maxTurnRateDPS = 30 //degrees per second


		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = KerbalField/Effects/Exhaust/ExhaustSmall
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostExhaustTransformName = boostTransform
		boostTransformName = boostTransform

  deployAnimationName = open
  deployedDrag = 0
  deployTime = 0.02

  optimumAirspeed = 680

  aero = true
  liftArea = 0.001
  steerMult = 10
  maxTorque = 60
  torqueRampUp = 75
  maxAoA = 20
  aeroSteerDamping = 6
  
  homingType = aam
  missileType = missile
  targetingType = heat
  allAspect = true
  heatThreshold = 30
  lockedSensorFOV = 10
  
	lockedSensorFOVBias
		{
			key = 0 	1.00 		// Highest weighing on centerline
			key = 0.5 	0.95 	
			key = 1 	0.90 
			key = 1.5 	0.85 
			key = 2 	0.80 
			key = 2.5 	0.75 
			key = 3 	0.70 		// 30% lower weighting at edge of sensor FOV
			key = 10	0.00		// Beyond Sidewinder FOV, provided for example purposes for large sensor FOV missiles
		}
	lockedSensorVelocityBias
		{
			key = 0 	1			// Highest weighing for target/flare travelling in same direction as tracked target
			key = 20 	0.75
			key = 45 	0.3
			key = 90	0.0			// ignore flares travelling perpendicular to target or in opposite direction
		}
  
  maxOffBoresight = 60
  uncagedLock = true
  
  radarLOAL = true
  
  engageAir = true
  engageMissile = false
  engageGround = false
  engageSLW = false
  
  minStaticLaunchRange = 0
  maxStaticLaunchRange = 9000
}

MODULE
{
	name = BDExplosivePart
	tntMass = 3
}

}

}

PART
{
	// Kerbal Space Program - Part Config
	// 
	// 

	// --- general parameters ---
	name = fjrt-aim-54c
	module = Part
	author = Android, Stardust

	// --- asset parameters ---
	//mesh = AIM54C_TCA.mu
	rescaleFactor = 0.7
    
    MODEL
    {
        model = FJRTMissilePack/Parts/TCA_Missiles_Set02/AIM54C_TCA
        texture = FJRTMissilePack/Parts/TCA_Missiles_Set02/tca_missiles_02_tex_atlas
    }


	// --- node definitions ---
	node_attach = 0.0, 0.194, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.194, 0, 0, 1, 0, 0
    //NODE
    {
    name = node0
    transform = node0
    size = 0
    method = FIXED_JOINT //FIXED_JOINT, HINGE_JOINT, LOCKED_JOINT, MERGED_PHYSICS or NO_PHYSICS
    }

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 2100
	cost = 2000
	category = Utility
	subcategory = 0
	bulkheadProfiles = srf
	title = FJRT AIM-54C Phoenix
	manufacturer = Kazamaru Aerospace
	description = Kerthenian Active Radar Homing missile designed to shoot down bombers at extreme range, using Track While Scan technology. Its effectiveness in competition is aided by exactly one factor: explosive power.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	// --- standard part parameters ---
	mass = 0.329
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 7000

    MODULE
	{
		name = MissileLauncher

		shortName = AIM-54C

		thrust = 10                     //KN thrust during boost phase
		cruiseThrust = 35               //thrust during cruise phase
		dropTime = 0.2                  //how many seconds after release until engine ignites
		boostTime = 0.2                   //seconds of boost phase
		cruiseTime = 30                //seconds of cruise phase
		guidanceActive = true           //missile has guidanceActive
		maxTurnRateDPS = 13.5             //thrust+maxTurnRateDPS is the value used by the AI to prioritize missiles over each other. maxTurnRateDPS, in degrees per second, ONLY affects flight of RCS missiles like the HEKV1

		decoupleSpeed = 10
        decoupleForward = false

		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		boostTransformName = boostTransform
		boostExhaustTransformName = exhaustTransform

		optimumAirspeed = 1500          //deals with how missile leads the target and calculation of turn radius for dynamic launch zone calculation, should match the max speed of your missile

		aero = true                     //Missile has aerodynamics
		liftArea = 0.002               //increases lift which helps with manuevering and turning, but also increases drag
		steerMult = 5                   //big number = steer harder...
		maxTorque = 40                  //ammount of torque that will be applied to the missile for turning
		maxAoA = 5                     //max AoA missile can turn at, will limit missile's turn radius below what is possible with maxTorque if set too low

		missileType = missile
		homingType = aam
        targetingType = inertial
		inertialDrift = 0
		gpsUpdates = 0
		terminalManeuvering = true
		terminalGuidanceType = radar
		terminalGuidanceDistance = 18000
        activeRadarRange = 18000

		maxOffBoresight = 45
		allAspect = true
		lockedSensorFOV = 10

		minStaticLaunchRange = 3000
		maxStaticLaunchRange = 180000

		radarLOAL = true

		chaffEffectivity = 0.8 //modifies how the missile targeting is affected by chaff, 1 is fully affected (normal behavior), lower values mean less affected (0 is ignores chaff), higher values means more affected

		radarLOAL = true                //radar lock on after launch
		
		activeRadarLockTrackCurve
		{
            key = 0	0
			key = 5 0
            key = 10 0.1	
            key = 15 0.2
			key = 20 0.3
			key = 25 0.4
			key = 30 0.5
			key = 35 0.6
			key = 40 0.7
		}

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false
	}
	
		

	MODULE
	{
		name = BDExplosivePart
		tntMass = 42.7
	}


}
